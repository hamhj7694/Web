<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>CSS 연습</title>

        <style>
            
            #header{
                background-color: aliceblue;
                text-align: center;
                padding: 3em 0em;

                background-image: url('../Day01/image/paris.jpg');
                background-size: auto; /* 기본값 */
                background-size: contain; /* 영역안에 표시된 사이즈로 */
                background-size: cover;
            }

            ul{
                list-style: none;
                border-top: 1px solid red;
                border-bottom: 1px solid red;
                padding: 10px 0;
                text-align: center;
            }

            ul li{
                display: inline;
                padding: 0 10px;
                letter-spacing: 0.25em;
            }

            ul li a{ text-decoration: none; color: black;}
            ul li a:hover{text-decoration: underline;}
        

        </style>
    </head>
    <body>
        <div id="header">
            <h1>함형준의 홈페이지</h1>
            <p>함형준의 홈페이지입니다.</p>
        </div>

        </ul>

    </body>

</html>
