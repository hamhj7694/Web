<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>변환</title>

        <style>
            div{
                width: 50px;
                height: 50px;
                border: 1px solid black;
                background-color: yellow;
            }

            #b2{
                background-color: blue;
                transform: translate(100px, 0px);
            }

            #b3{
                background-color: red;
                transform: scale(1.2, 1.5); /* x,y */
            }

            #b4{
                background-color: blueviolet;
                transform: rotate(30deg); /* 각도 단위: deg, rad */
            }

        </style>



    </head>
    <body>
        
        <div id="b1">box1</div>
        <div id="b2">box2</div>
        <div id="b3">box3</div>
        <div id="b4">box4</div>



    </body>
</html>
