<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>전환</title>

        <style>
            div{
                width: 100px;
                height: 50px;
                border: 1px solid red;
                background-color: burlywood;

                /* 속성 값이 바뀔 때 전환 효과를 주겠다 */
                transition: width 3s;
            }

            div:hover{
                width: 200px;
            }

        </style>
    </head>
    <body>
        <div>마우스를 올려보세요</div>
    </body>
</html>
