<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>전환2</title>

        <style>
            div.pngs img{
                background-color: red;
                width: 200px;
                height: 100px;

                transition: width 3s, height 3s, background-color 3s, transform 3s;
            }

            div.pngs img:hover{
                width: 300px;
                height: 150px;
                background-color: blue;

                transform: rotate(1.5rad); /*라디안 단위*/
                transform: rotate(30deg) scale(1.2, 1.2) translate(90px, 0px); /*라디안 단위*/
            }
        </style>
    </head>
    <body>
        <div class="pngs">
            <img src="./images/pome.png" alt="">
            <img src="./images/poodle.png" alt="">
        </div>
    </body>
</html>
