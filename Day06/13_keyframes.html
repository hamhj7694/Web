<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title> 애니메이션 </title>

        <style>
            #box{
                background-color: green;
                width: 50px;
                height: 50px;
                border-radius: 50%;
                position: absolute;

                /* 애니메이션 적용 */
                animation-name: bounce;
                animation-duration: 2s;
                animation-iteration-count: 5;
                animation-iteration-count: infinite;
                animation-timing-function: ease; /* 느리다가, 빠르게 */
            }

            /* 애니메이션 장면들 만들기 */
            @keyframes my_anime
            {
                0%{left: 0px; top: 0px;}
                25%{left:100px; top: 50px}
                50%{left: 200px; top: 0px;}
                75%{left:100px; top: 300px}
                100%{left: 0px; top: 0px;}
            }

            @keyframes bounce
            {
                0%,100%{
                    left: 0px; top: 0px;
                    animation-timing-function: ease-in;
                }

                50%{
                    top: 200px;
                    animation-timing-function: ease-out;
                }
            }

        </style>
    </head>

    <body>
        <div id="box"></div>
    </body>
</html>
