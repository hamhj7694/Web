<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>레이아웃 연습</title>

        <style>
            #wrapper{
                width: 600px;
                border: 1px solid black;
                margin-left: auto; margin-right: auto;
            }

            #header{
                background-color: yellow;
                width: 100%;
                height: 50px;
            }

            #nav{
                background-color: pink;
                width: 30%;
                height: 150px;
                float: left;
            }

            #main{
                background-color: aquamarine;
                width: 70%;
                height: 150px;
                float: right;
            }

            #footer{
                background-color: black;
                color: white;
                width: 100%;
                height: 50px;
                clear: both;
            }

        </style>
    </head>
    <body>
        <div id="wrapper">

            <div id="header">HEADER</div>
            <div id="nav">NAV MENU</div>
            <div id="main">COMTENT</div>
            <div id="footer">FOOTER</div>

        </div>
    </body>
</html>
