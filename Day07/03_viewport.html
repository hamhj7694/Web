<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>viewport</title>

        <!-- 뷰포트 : 웹 브라우저가 화면을 그려내는 가상의 영역 -->
        <!-- 데스크탑 브라우저는 창의 크기에 따라 너비가 맞추어 변경됨 -->
        <!-- 모바일 브라우저는 디바이스 크기와 상관없이 무조건 980PX로 너비 인식함. 그렇기에 css로 적용한 너비가 다르게(작게) 보임. -->
        <!-- 그래서 모바일 UI 제작할 때는 반드시 viewport를 설정해 줘야 함 -->

        <!-- <meta name="viewport" content="width=400, initial-scale=1.0"> -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    </head>
    <body>
        <h2>View Port Test</h2>
        <p>이것은 뷰포트 테스트 페이지 입니다.</p>

        <img src="../Day01/image/penguins.jpg" alt="팽귄들" style="width: 200px; border: 1px dotted red;">
    </body>
</html>
