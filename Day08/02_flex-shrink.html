<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-shrink</title>

    <style>
        #container{display: flex;}
        #container>div{
            background-color: blue;
            color: white;
            width: 100px;
            margin: 10px;
            text-align: center;
            line-height: 50px;
        }
    </style>
</head>
<body>
    
    <div id="container">
        <div>1</div>
        <div>2</div>
        <div style="flex-shrink: 0;">3</div> <!-- 너는 줄어들지마! 0배 줄어들어! -->
        <div>4</div>
        <div>5</div>
        <div style="flex-shrink: 2;">6</div> <!-- 너는 다른애들보다 2배 줄어들어! -->
        <div>7</div>
        <div>8</div>
        <div>9</div>
    </div>

</body>
</html>
