<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>combination selector</title>
    <style>
        body{background-color: #eeeeee;}
        /* 자손(하위) 선택자 */
        section p{background-color: white; padding: 1rem;}
        /* 자식 선택자 */
        section>p{color: violet;}
        /* 인접형제 선택자 */
        section h3+p{background-color: black; color: white;} /* h3 다음에 등장하는 첫 p요소 하나만 */
        /* 형제 선택자 */
        section>div h4~p{border-radius: 10px; box-shadow: 0px 1px 3px gray; color: blue;} /* h4 다음에 오는 모든 p요소들 */
    </style>
</head>
<body>

    <h1>콤비네이션 선택자에 대해 알아보기</h1>

    <section>
        <h3>예약 방법 & 사용 요금</h3>
        <p>아직 온라인 예약 신청이 준비되지 않았습니다. 나중에 시도해 주세요.</p>
        <p>문의 연락처 : 02-111-2222</p>

        <hr>
        <div>
            <h4>ROOM 형태 및 이용가격</h4>
            
            <p>가족실(2~4인) : 60,000원/일</p>
            <span>예약가능</span>
            
            <p>도미토리(4인 공용) : 25,000원/일</p>
            <span>예약불가</span>
        </div>
    </section>
    
</body>
</html>
