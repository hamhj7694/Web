<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트 연습</title>

    <!-- 외부 스크립트 연결 -->
    <script src="./01_ex.js"></script>

    <!-- 내부 스크립트 -->
    <script>
        // 이 영역안에서는 JS언어의 문법체계를 따름
        document.write("내부 스크립트 입니다.<br>");
    </script>

</head>
<body>
    <hr>

    <!-- HTML 요소의 속성으로 JS 함수를 사용하는 모습을 '인라인 스크립트'라고 함 -->
    <button onclick="aaa()">눌러주세요.</button>

    <!-- 내부 스크립트 -->
    <script>
        document.write("<hr>");
        document.write("aaa");
    </script>

</body>
</html>
