<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Bom</title>
</head>

<!-- --------------------------------------------------------------------- -->
<!-- [활용 메모] -->
<!-- [활용 메모] 팝업 메시지처럼... 채팅 왔을 때, 창을 안 열고 있으면 알림용 창으로 우측하단에 띄우고, 금방 자동으로 닫게 하기! -->
<!-- [활용 메모] 링크 인코딩, 디코딩 -->
<!-- --------------------------------------------------------------------- -->

[활용 메모] 팝업 메시지처럼... 채팅 왔을 때, <br>
창을 안 열고 있으면 알림용 창으로 우측하단에 띄우고[ open ] <br>
금방 자동으로 닫게 하기! [ setTimeout ] <hr>
    
<body>
    
    <!-- BOM : 브라우저를 관리하는 내장된 js 객체들 -->
    <!-- 1. window : 최상위 객체(브라우저 창 전체를 관리) -->

    <!-- 주요기능들 -->
    <!-- 1) open(), close() : 새로운 창을 열기/닫기 -->
    <button onclick="openNaver()">네이버</button>
    <script>
        function openNaver(){
            //window.open('https://www.naver.com'); // 기본이 새 탭으로 열림 [target="_blank"]
            //window.open('https://www.naver.com', '_self'); // 파라미터 속 속성 (href, target) 순서로 작성

            // 세번째 파라미터로 옵션을 추가하면.. 새 창으로 웹문서를 열 수 있음.
            var option= 'width=500, height=200, left=200, top=150';
            window.open('https://www.naver.com', '_blank', option);
        }
    </script>

    <hr> <!-- -------------------------------------------------------------- -->

    <button onclick="bbb()">빈 윈도우창 띄우기</button>
    <button onclick="ccc()">메시지 윈도우창 닫기</button>
    <script>
        var win= undefined;
        function bbb(){
            // 창 여러개 못띄우게 막기(1개까지만 열리게 함)
            if(win!=undefined) return;

            win= window.open('','','width=500, height=200, left=200, top=150');
            // win에 넣어서 retrun 받을수도 있다. 앞으로 win 객체가 처리..
            win.document.write('<h2>안녕 새 윈도우!</h2>');
        }
        function ccc(){
            win.close();
            // if(win!=undefined) return; 때문에 1번 닫으면 다시 못 열음... 
            win= undefined; //그래서 다시 win 값에 undefined를 넣어줘야함 
        }
    </script>

    <hr> <!-- -------------------------------------------------------------- -->

    <!-- 윈도우 창 이동시키기 -->
    <button onclick="eee()">open window</button>
    <button onclick="fff()">move window</button>

    <script>
        var win=undefined;
        function eee(){
            win= window.open('','','width=500, height=200'); // 원래는 위치 설정 안했으면 왼쪽 상단에서 열림
            win.document.write('오늘의 특가 세일 상품!');

            // 특정 위치로 이동(해당 위치에서 열리도록 함)
            win.moveTo(300, 100); //x축, y축
        }
        function fff(){
            // 현재 위치기준으로 조금씩 이동...
            win.moveBy(10,20); //x축, y축
            // 작은 창이 앞으로 오게하려면 focus(); 활용
            win.focus();
        }
    </script>
    <hr> <!-- -------------------------------------------------------------- -->

    <!-- 일정 시간 후에 특정 함수가 실행되도록.. setTimeout, setInterval, clearInterval -->
    <button onclick="ggg()">3초 후에 경고창 띄우기</button>
    <script>
        function showAlert(){
            alert('3초 경과!');
        }
        
        function ggg(){
            window.setTimeout(showAlert, 3000); // 3000ms == 3s 후 실행
        }
    </script>

    <br>

    <h3 id="hh">0</h3>
    <button onclick="hhh()">1초마다 카운트 증가 시작</button>
    <button onclick="iii()">카운트 멈추기</button>
    
    <script>
        function showCound(){
            // p요소에 써있는 숫자 0에 1씩 더하기
            var h3 = document.querySelector('#hh');

            // h3.innerHTML= h3.innerHTML + 1; //이렇게 하면 문자열 결합만 됨
            h3.innerHTML= parseInt(h3.innerHTML) + 1;
        }

        var interval_id;
        function hhh(){
            // 1초 마다 showCount라는 이름의 함수를 실행
            interval_id= window.setInterval(showCound,1000); //식별자 라턴됨
        }

        function iii(){
            window.clearInterval(interval_id);
        }
    </script>
    <!-- [활용 메모] 자동 클리커 만들수 있겠다. -->

    <hr> <!-- -------------------------------------------------------------- -->

    <!-- 기타 유용한 메소드들 -->
    <script>
        // 웹브라우저의 인터넷 주소창의 URL은 기본적으로 한글이나 띄어쓰기 같은 문자는 사용 못함.
        // 그래서 만약. 한글이나 띄어쓰기. 또는 특수문자 중 일부를 사용하고 싶다면..
        // URL에서 인식 가능한 문자로 변환해야 함.. 이를 url encoding(암호화)라고 함.

        // 인코딩을 해주는 기능 window 최상위객체가 가지고 있음.
        // 최상위객체 window 키워드는 생략 가능
        var a=window.encodeURI('http://www.aaa.com/펑!챗.html'); //파일 명이 한글과 띄어쓰기라면
        document.write('인코딩 된 URL: ' + a +'<br>');

        // 반대로 인코딩된 URL 해독(decode)해주는 기능도 있음.
        var b= decodeURI(a);
        document.write('디코딩된 URL: '+b+'<br>');

        // eval() 문자열 데이터를 JS 코드인 것 처럼 해동해 실행해주는 기능
        var x= eval('10+2*6'); //원래 문자는 계산 안 되는데, eval 활용해서 JS 코드화함
        document.write(x +'<br>');

        // 숫자로 변환 가능한 모양이 아닌지 확인해주는 기능 [parseInt() 하기 전에 확인 용도]
        document.write( isNaN(10) + '<br>'); // false -- parseInt() 가능
        document.write( isNaN('10') + '<br>'); // false -- parseInt() 가능
        document.write( isNaN('안녕하세요') + '<br>'); // true -- parseInt() 불가능

    </script>
    [활용 메모] 링크 인코딩, 디코딩

    <hr> <!-- -------------------------------------------------------------- -->

    <!-- window 최상위 객체의 멤버변수들 중 주요 객체 소개 -->
    <!-- 2. documenet : 웹문서를 관리하는 여러 기능 가진 객체 -->
    <script>
        window.document.write('평소 쓰던 그 기능');
    </script>
    
    <hr> <!-- -------------------------------------------------------------- -->

    <!-- 3. screen : 모니터 사이즈 -->
    <script>
        // 모니터 해상도 정보
        document.write('모니터 해상도: '+screen.width+' * '+screen.height+'<br>');
        document.write('작업 표시줄 제외한 해상도: '+screen.availWidth+' * '+screen.availHeight+'<br>');

        // [번외] 웹브라우저 창의 해상도를 알고 싶다면? window 객체가 가지고 있는 정보!
        document.write('브라우저 창 크기: '+ window.outerWidth + ' * ' + window.outerHeight +'<br>');
        document.write('브라우저 창 크기: '+ window.innerWidth + ' * ' + window.innerHeight +'<br>');
    </script>

    <!-- 버튼으로 전체화면으로 확대할때.. 활용 -->
    <button onclick="jjj()">전체화면 윈도우</button>
    <script>
        function jjj(){
            var option = 'width=' + screen.availWidth + ',height=' + screen.availHeight;
            open('','',option);
        }
    </script>

    <hr> <!-- -------------------------------------------------------------- -->
    
    <!-- 4. location : URL 정보 관리 객체 -->
    <script>
        //location 객체의 주요 멤버변수(속성)
        document.write( location.href +'<br>' );
        document.write( location.protocol +'<br>' );
        document.write( location.pathname +'<br>' );
    </script>

    <!-- location 객체의 주요 기능함수들 -->
    <button onclick="mmm()">새로운 문서 열기</button>
    <button onclick="kkk()">새로운 문서로 대체하여 열기</button>
    <button onclick="nnn()">현재 문서 다시 열기</button>
    <script>
        function mmm(){
            // location.assign('https://www.naver.com'); //뒤로가기 버튼 활성화 됨
            // [실무] url을 바꾸는 것이기에.. 함수 대신 속성값을 변경해도 됨.
            location.href='https://www.naver.com'; //더 많이 사용 됨
        }
        function kkk(){
            location.replace('https://www.naver.com'); //뒤로가기 버튼 활성화 X
        }
        function nnn(){
            location.reload('https://www.naver.com'); //뒤로가기 버튼 활성화 됨
        }
    </script>

    <!-- 5. history : 방문한 URL 정보를 가지고 있음. -->
    <script>
        document.write('방문 페이지 수: '+ history.length + '<br>');
    </script>

    <button onclick="history.back()">뒤로</button>
    <button onclick="history.forward()">앞으로</button>
    <button onclick="history.go(-2)">2칸 뒤</button>

    
    <!-- 6. navigator : 브라우저의 정보 관리 객체 : 나중에 새로운 기능들이 이 객체의 하위멤버로 추가됨(ex.위치기반서비스, 웹캠) -->
    <script>
        document.write( navigator.appCodeName +'<br>' );
        document.write( navigator.appName +'<br>' );
        document.write( navigator.appVersion +'<br>' );
        document.write( navigator.platform +'<br>' ); // 사용자가 접속하는 환경을 파악할 수 있음. 대응 및 맞춤 가능!
        document.write( navigator.userAgent +'<br>' );
    </script>

</body>
</html>
