<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kakao map API</title>

    <!-- [상식] 모든 지도 API는 실제 서버에 업로드 되어야 실행 가능 -->

    <!-- 카카오지도 API(라이브러리, 모듈) 사용하기 -->
    <!-- 개발 전에 반드시 [카카오 개발자 사이트 developers.kakao.com ]의 튜토리얼 문서를 확인하고 제작 -->
    <!-- 카톡 로그인, 카카오 맵, 카카오톡에게 메시지 보내기, 로컬(인근 맛집, 화장실 등...) -->

    <!-- REST API 키 : 파이썬, php, 서버 등 / JavaScript 키 : 웹 / 네이티브 앱 키 : 안드로이드, ios-->

    <!-- 개발 가이드에 따라 -- 앱 생성 및 API 키 발급 받음 -->
    <!-- 실제 지도를 불러오는 작업 수행하는 카카오의 지도 라이브러리 적용(왜부 스크립트 경로 사용) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=5d16c15d63a1808e9ce3dc9a93c2b50e"></script>

    <!-- 지도 띄울 js 코드 작성 defer로 body 다음 지연 실행 -->
    <script src="./kakaomap.js" defer></script>
</head>
<body>
    
    <h1>현재 위치를 받아서 표시하는 지도</h1>
        
    <!-- 지도 그릴 영역 요소 생성(사이즈 지정 필수!) -->
    <div id="map" style="width: 500px; height: 400px; border: 1px solid black;"></div>

</body>
</html>
