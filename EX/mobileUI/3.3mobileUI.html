<!-- 무료 아이콘 이미지 제공 사이트 : flaticon -->
<!-- 모바일 UI 샘플 사이트 사진들이 제공되는 사이트 : wwit design -->

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼점삼 따라하기</title>

    <link rel="stylesheet" href="./mobileUI.css">
</head>
<body>
    
    <div id = "container">
        <div class="toolbar">
            <img class="toolbar-back" src="./img/left-arrow.png" alt="뒤로가기">
            <button class="toolbar-btn">문의하기</button>
        </div>
        <h2>
            <span class="blue">2026년 기준으로</span> 본인이 해당하는 조건이 있다면 모두 골라주세요
        </h2>
        
        <div class="option-container">
            <div class="option">
                <img src="./img/wedding-ring.png" alt="배우자">
                <p>배우자가 있어요</p>
            </div>
            <!-- 여러개의 클래스명 지정 가능! -->
            <div class="option selected">
                <img src="./img/wedding-ring.png" alt="배우자">
                <p>주민등록상 세대주입니다</p>
            </div>
            <div class="option">
                <img src="./img/wedding-ring.png" alt="배우자">
                <p>장애인 이에요</p>
            </div>
            <div class="option">
                <img src="./img/wedding-ring.png" alt="배우자">
                <p>가족중에 장애인이 있어요</p>
            </div>
            <div class="option">
                <img src="./img/wedding-ring.png" alt="배우자">
                <p>위탁 아동이 있어요</p>
            </div>

            <button class="next-btn">다음</button>

        </div>

    </div>

</body>
</html>
