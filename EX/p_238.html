<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>238p. 주문 배송 페이지 예시</title>

        <style>
            .mid>h2{color: #FF0000; font-size: 1.5em; text-align: center;}
            p{font-size: 1.2em; line-height: 2em; font-weight: bold; text-align: center;}
            .accent{color: #0000ff;}
            .smalltext{font-size: 0.7em;}

            .check{margin-top:0; color: white; text-align: left; background-color: black;}
            div{width: 620px; margin: 0 auto; border: 1px dotted black;}
            img.header{display: block; margin: 0 auto; margin-bottom: 5px;}
            div>hr{border: none; border-bottom: 1px dashed #0000ff;}
        </style>

    </head>
    <body>
        <img class="header" src="../Day01/image/커피들.jpg" alt="커피들 이미지">
        
        <div class="mid">
            <p class="check">확인하세요</p>

            <h2>주문 및 배송</h2>
            <p><span class="accent">오후 2시 이전</span> 주문건은 당일 발송합니다. <br>
            2시 이후 주문건은 다음날 발송합니다(주말 제외)</p>
            <hr>
            <h2>교환 및 환불</h2>
            <p>불만족시 <span class="accent">100% 환불</span>해 드립니다. <br>
            고객센터로 전화주세요</p>
            <hr>
            <h2>고객센터</h2>
            <p>0000-0000 <br>
            <span class="smalltext">상담시간 : 오전 9시 ~ 오후 6시 (토/일, 공휴일 휴무)</span> </p>
        </div>
    </body>
</html>
