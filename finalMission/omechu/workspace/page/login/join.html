<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오메추! 회원가입</title>

    <link rel="stylesheet" href="../../css/login/join.css">
    <script defer src="../../js/login/join.js"></script>
</head>
<body>
    <div class="wrap join_wrap">

        <header class="header join_header">
            <a href="../../index.html">
                <h1 class="logo">
                    <img src="../../assets/logo/logo.png" alt="말랑곰 얼굴">
                    오메추
                </h1>
            </a>
        </header>

        <main class="join_main">

            <section class="join_card">

                <div class="join_title_box">
                    <img 
                        src="../../assets/home/char_main.png" 
                        alt="말랑곰"
                        class="join_bear_img"
                    >

                    <p class="join_badge">오메추와 함께해요!</p>
                    <h1>회원가입</h1>
                    <p>나만의 메뉴 추천 기록을 만들어보세요.</p>
                </div>

                <hr> <br>

                <form id="joinForm" class="join_form">

                    <div class="input_box">
                        <div>
                            <label for="joinId">아이디</label>
                            <p class="input_hint"> (※ 영문, 숫자 조합 4자 이상)</p>
                            <input type="text" id="joinId" placeholder="아이디를 입력해주세요" autocomplete="username">
                        </div>
                        <button type="button" class="id_duplicate_check_btn">중복확인</button>
                    </div>

                    <div class="input_box">
                        <label for="joinPw">비밀번호</label>
                        <p class="input_hint"> (※ 4자 이상)</p>
                        <input type="password" id="joinPw" placeholder="비밀번호를 입력해주세요" autocomplete="new-password">
                    </div>

                    <div class="input_box">
                        <label for="joinPwCheck">비밀번호 재확인</label>
                        <input 
                            type="password" id="joinPwCheck" placeholder="비밀번호를 다시 입력해주세요" autocomplete="new-password">
                    </div>

                    <hr>
                    
                    <div class="input_box">
                        <label for="joinNickname">닉네임</label>
                        <input 
                            type="text" id="joinNickname" placeholder="닉네임을 입력해주세요">
                    </div>

                    <div class="input_box">
                        <label for="joinEmail">이메일</label>
                        <p class="input_hint">(※ ID / PW 찾기, 긴급 연락용)</p>
                        <input type="text" id="joinEmail" placeholder="이메일를 입력해주세요">
                    </div>

                    <hr>

                    <div class="agree_box">
                        <label>
                            <input type="checkbox" id="agreeCheck">
                            <span>오메추 개인정보 수집에 동의합니다.</span>
                        </label>
                    </div>

                    <button type="submit" class="join_submit_btn">
                        회원가입
                    </button>

                </form>

                <div class="join_link_area">
                    <span>이미 계정이 있나요?</span>
                    <a href="./login.html">로그인하기</a>
                </div>

            </section>

        </main>

    </div>
</body>
</html>
