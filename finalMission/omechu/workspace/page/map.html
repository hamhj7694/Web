<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오메추! 주변 맛집 지도</title>

    <link rel="stylesheet" href="../css/map.css">

    <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=5d16c15d63a1808e9ce3dc9a93c2b50e&libraries=services&autoload=false"></script>

    <script defer src="../js/login/login_common.js"></script>
    <script defer src="../js/map.js"></script>
</head>
<body>
    <div class="wrap">

        <!-- ================================
            헤더
        ================================= -->
        <header class="header">
            <a href="../index.html">
                <h1 class="logo">
                    <img src="../assets/logo/logo.png" alt="말랑곰 얼굴">
                    오메추
                </h1>
            </a>

            <a href="./login/login.html" class="login-link">👤 로그인</a>
        </header>


        <!-- ================================
            메인
        ================================= -->
        <main class="main map_main">

            <!-- 페이지 제목 -->
            <section class="map_title">
                <p>내 주변 맛집 찾기</p>
                <h1>맛집 지도</h1>
                <span>현재 위치 근처의 음식점과 추천 메뉴를 찾아보세요.</span>
            </section>

            <!-- 필터 영역 -->
            <section class="map_filter_section" id="foodCategory">
                <div class="map_filter_list">
                    <button type="button" class="map_filter_btn selected">전체</button>
                    <button type="button" class="map_filter_btn" data-category="한식">한식</button>
                    <button type="button" class="map_filter_btn" data-category="중식">중식</button>
                    <button type="button" class="map_filter_btn" data-category="일식">일식</button>
                    <button type="button" class="map_filter_btn" data-category="양식">양식</button>
                    <button type="button" class="map_filter_btn" data-category="분식">분식</button>
                    <button type="button" class="map_filter_btn" data-category="디저트">디저트</button>
                    <button type="button" class="map_filter_btn" data-category="기타">기타</button>
                </div>
            </section>
            
            <!-- 검색 영역 -->
            <section class="map_search_section">
                <div class="map_search_box">
                    
                    <input 
                        type="text" 
                        id="mapSearchInput" 
                        placeholder="음식, 식당, 지역명 등"
                    >

                    <button type="button" id="mapResetBtn" class="map_reset_btn">
                        초기화
                    </button>
                    
                    <button type="button" id="mapSearchBtn" class="map_search_btn">
                        검색
                    </button>

                </div>
                <div class="map_all">
                    <button type="button" id="currentLocationBtn" class="current_location_btn">
                            📍 현재 내 위치로 찾기
                    </button>
                    
                    <div class="distance_box">
                        <input
                            type="range"
                            class="distance_range"
                            min="0"
                            max="3"
                            step="1"
                            value="1"
                        >

                        <div class="distance_labels">
                            <span>100m</span>
                            <span>250m</span>
                            <span>500m</span>
                            <span>1km</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 지도 영역 -->
            <section class="map_area_section">
                <div id="map" class="map_box"><p>로딩중...</p></div>
            </section>


            <!-- 주변 맛집 리스트 -->
            <section class="place_section">
                <div class="section_header">
                    <h2>주변 맛집</h2>
                    <div class="page">
                        <button> ◀ </button>
                        <p>총 <strong>0</strong>개 - <strong>0/0</strong>페이지</p>
                        <button> ▶ </button>
                    </div>
                </div>

                <div class="place_list">
                    <!-- js로 생성 -->
                </div>

                <div class="page">
                    <button> ◀ </button>
                    <p>총 <strong>0</strong>개 - <strong>0/0</strong>페이지</p>
                    <button> ▶ </button>
                </div>

                <p class="Information_note">※ 식당, 메뉴 정보가 다를 수 있습니다.</p>
            </section>

            <!-- 푸터 -->
            <footer class="footer">
                &copy; 2026 함형준 <br>
                ☎ 010-56616-7694 <br>
                ✉ hambrojun@naver.com
            </footer>

        </main>

        <!-- ================================
            하단 네비게이션
        ================================= -->
        <nav class="nav">
            <ul>
                <li>
                    <a class="home" href="../index.html">
                        <span>홈</span>
                        <img src="../assets/icon/home.png" alt="홈">
                    </a>
                </li>

                <li>
                    <a class="food" href="./wiki.html">
                        <span>푸드 위키</span>
                        <img src="../assets/icon/food.png" alt="푸드">
                    </a>
                </li>

                <li>
                    <a class="map active" href="./map.html">
                        <span>지도</span>
                        <img src="../assets/icon/map.png" alt="지도">
                    </a>
                </li>

                <li>
                    <a class="my" href="./mypage.html">
                        <span>마이</span>
                        <img src="../assets/icon/my.png" alt="마이">
                    </a>
                </li>
            </ul>
        </nav>

    </div>
</body>
</html>
