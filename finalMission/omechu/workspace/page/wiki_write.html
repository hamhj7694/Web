<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오메추! 위키 작성</title>

    <!-- 위키 작성 페이지 전용 CSS -->
    <link rel="stylesheet" href="../css/wiki_write.css">

    <script defer src="../js/login/login_common.js"></script>
    <!-- 위키 작성 페이지 전용 JS -->
    <script defer src="../js/wiki_write.js"></script>
</head>
<body>
    <div class="wrap">

        <!-- ================================
            헤더
        ================================= -->
        <header class="header">
            <a href="../index.html">
                <h1 class="logo">
                    <img src="../assets/logo/logo.png" alt="말랑곰 얼굴">
                    오메추
                </h1>
            </a>

            <a href="./login/login.html" class="login-link">👤 로그인</a>
        </header>


        <!-- ================================
            메인
        ================================= -->
        <main class="main wiki_write_main">

            <!-- 페이지 제목 -->
            <section class="wiki_write_title">
                <p>나도 음식 추천할래요!</p>
                <h1>위키 작성</h1>
                <span>추천하고 싶은 음식을 등록해보세요.</span>
            </section>


            <!-- ================================
                위키 작성 폼
            ================================= -->
            <form id="wikiWriteForm" class="wiki_write_form">

                <!-- 음식 이름 -->
                <div class="form_group">
                    <label for="foodNameInput">음식 이름</label>
                    <input 
                        type="text" 
                        id="foodNameInput" 
                        placeholder="예: 제육볶음"
                    >
                </div>


                <!-- 카테고리 -->
                <div class="form_group">
                    <label for="foodCategorySelect">카테고리</label>
                    <select id="foodCategorySelect">
                        <option value="">카테고리를 선택해주세요</option>
                        <option value="한식">한식</option>
                        <option value="중식">중식</option>
                        <option value="일식">일식</option>
                        <option value="양식">양식</option>
                        <option value="분식">분식</option>
                        <option value="디저트">디저트</option>
                        <option value="기타">기타</option>
                    </select>
                </div>

                <!-- 코멘트 -->
                <div class="form_group">
                    <label for="foodCommentInput">코멘트</label>
                    <textarea 
                        id="foodCommentInput" 
                        placeholder="ㄴ예: 매콤달콤해서 밥이랑 먹으면 진짜 잘 어울려요!"
                    ></textarea>

                    <p class="form_hint">
                        ※ 작성한 코멘트는 해당 음식 위키의 코멘트 목록에 함께 등록돼요.
                    </p>
                </div>

                <!-- 태그 -->
                <div class="form_group tag_form_group">
                    <label>태그</label>

                    <!-- 시간 태그 -->
                    <div class="tag_select_box">
                        <p class="tag_group_title">언제 먹기 좋아요?</p>

                        <div class="tag_chip_list">
                            <label class="tag_chip">
                                <input type="checkbox" name="timeTags" value="아침">
                                <span>#아침</span>
                            </label>

                            <label class="tag_chip">
                                <input type="checkbox" name="timeTags" value="점심">
                                <span>#점심</span>
                            </label>

                            <label class="tag_chip">
                                <input type="checkbox" name="timeTags" value="저녁">
                                <span>#저녁</span>
                            </label>

                            <label class="tag_chip">
                                <input type="checkbox" name="timeTags" value="야식">
                                <span>#야식</span>
                            </label>
                        </div>
                    </div>


                    <!-- 상황 태그 -->
                    <div class="tag_select_box">
                        <p class="tag_group_title">어떤 상황에 어울려요?</p>

                        <div class="tag_chip_list">
                            <label class="tag_chip">
                                <input type="checkbox" name="situationTags" value="혼밥">
                                <span>#혼밥</span>
                            </label>

                            <label class="tag_chip">
                                <input type="checkbox" name="situationTags" value="데이트">
                                <span>#데이트</span>
                            </label>

                            <label class="tag_chip">
                                <input type="checkbox" name="situationTags" value="친목">
                                <span>#친목</span>
                            </label>

                            <label class="tag_chip">
                                <input type="checkbox" name="situationTags" value="회식">
                                <span>#회식</span>
                            </label>

                            <label class="tag_chip">
                                <input type="checkbox" name="situationTags" value="해장">
                                <span>#해장</span>
                            </label>

                            <label class="tag_chip">
                                <input type="checkbox" name="situationTags" value="배달">
                                <span>#배달</span>
                            </label>
                        </div>
                    </div>


                    <!-- 직접 작성 태그 -->
                    <div class="tag_select_box">
                        <label for="foodCustomTagsInput" class="tag_group_title">
                            직접 태그 작성
                        </label>

                        <input 
                            type="text" 
                            id="foodCustomTagsInput" 
                            placeholder="예: 매운맛, 가성비, 든든함"
                        >

                        <p class="form_hint">
                            ※ 직접 작성 태그는 쉼표로 구분해주세요. 예: 매운맛, 가성비, 든든함
                        </p>
                    </div>
                </div>

                <!-- 이미지 -->
                <div class="form_group">
                    <label for="foodImageInput">이미지</label>

                    <div class="image_upload_box">
                        <div class="custom_file_box">
                            <input 
                                type="file" 
                                id="foodImageInput" 
                                accept="image/*"
                            >

                            <label for="foodImageInput" class="custom_file_btn">
                                이미지 선택하기
                            </label>

                            <span id="fileNameText" class="file_name_text">
                                선택된 이미지가 없어요
                            </span>
                        </div>

                        <div class="image_preview_box hidden" id="imagePreviewBox">
                            <img 
                                id="imagePreview" 
                                src="" 
                                alt="이미지 미리보기"
                            >
                        </div>
                    </div>

                    <p class="form_hint">
                        ※ 음식 사진을 등록하면 위키 카드와 상세 페이지에 사용돼요.
                    </p>
                </div>

                <!-- 작성 버튼 -->
                <div class="wiki_write_btn_area">
                    <button type="submit" class="submit_btn">
                        위키 등록
                    </button>

                    <button type="button" id="cancelBtn" class="cancel_btn">
                        취소
                    </button>
                </div>

            </form>


            <!-- 푸터 -->
            <footer class="footer">
                &copy; 2026 함형준 <br>
                ☎ 010-56616-7694 <br>
                ✉ hambrojun@naver.com
            </footer>

        </main>


        <!-- ================================
            하단 네비게이션
        ================================= -->
        <nav class="nav">
            <ul>
                <li>
                    <a class="home" href="../index.html">
                        <span>홈</span>
                        <img src="../assets/icon/home.png" alt="홈">
                    </a>
                </li>

                <li>
                    <a class="food active" href="./wiki.html">
                        <span>푸드 위키</span>
                        <img src="../assets/icon/food.png" alt="푸드">
                    </a>
                </li>

                <li>
                    <a class="map" href="./map.html">
                        <span>지도</span>
                        <img src="../assets/icon/map.png" alt="지도">
                    </a>
                </li>

                <li>
                    <a class="my" href="./mypage.html">
                        <span>마이</span>
                        <img src="../assets/icon/my.png" alt="마이">
                    </a>
                </li>
            </ul>
        </nav>

    </div>
</body>
</html>
