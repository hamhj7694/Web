<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>친구 지원서</title>
        <link rel="stylesheet" href="./index.css">
    </head>

    <body>
        <div class="container">
            <div id="header">
                <div class="sub-header">
                    <h1>"구해줘 친구들!" 친구 지원서</h1>
                    <hr>

                    <div id="header">
                        <h4>
                            "지원서 작성하고 새 친구/애인을 만나보세요!" <br>
                            <strong style="color: rgb(255, 63, 95);">'구조 대기 명단'</strong>에서 서로를 알아가 보세요!
                        </h4>

                        <div class="friend-mini">
                            <button type="button" onclick="location.href='./fr_list.php'">
                                구조 대기 명단
                            </button>
                        </div>
                    </div>
                </div>

            </div>
            <hr>

            <form action="ok.php" method="post" enctype="multipart/form-data">
                <h4>내 정보</h4>

                <div class="info-grid">
                    <div>
                        <div class="form-row">
                            <label>이름</label>
                            <input type="text" name="name" placeholder="이름을 적어주세요🥰">
                        </div>

                        <div class="form-row">
                            <label>연락처</label>
                            <input type="text" name="phone" placeholder="010-0000-0000 or 인스타 ID">
                        </div>

                        <div class="form-row">
                            성별 :
                            <label><input type="radio" name="gender" value="남성">남성</label>
                            <label><input type="radio" name="gender" value="여성" checked>여성</label>
                        </div>

                        <div class="form-row">
                            <label>나이(20~40)</label>
                            <input class="age-input" type="number" name="age" min="20" max="40" value="24">
                        </div>
                    </div>

                    <div class="file-box">
                        <label>사진 자랑하기</label>

                        <div class="preview-box">
                            <img id="preview-img" alt="사진 미리보기">
                            <span id="preview-text">사진 미리보기</span>
                        </div>

                        <input type="file" name="img1" id="img1" accept="image/*">
                    </div>

                </div>

                <hr>

                <h4>이 친구 구해줘! 지원 분야(복수 지원 가능)</h4>
                <ul>
                    <label><input type="checkbox" name="pick[]" value="애인" checked>애인</label>
                    <label><input type="checkbox" name="pick[]" value="썸남/썸녀" checked>썸남/썸녀</label>
                    <label><input type="checkbox" name="pick[]" value="친구 및 지인">친구 및 지인</label>
                </ul>

                <hr>

                <h4>성격 및 매력 포인트</h4>
                <textarea name="msg2" rows="4" placeholder="자신의 성격이나 매력을 간략히 써 주세요!"></textarea>

                <hr>

                <div class="button-row">
                    <div>
                        <input type="submit" value="접수하기">
                        <input type="reset" value="다시쓰기">
                    </div>
                </div>
            </form>

        </div>

        <h5 id="gunggo"><strong style="color: rgb(255, 45, 80);">[개인정보 취급 주의!]</strong>
        적어 주신 이름, 성별, 나이, 사진, 매력 포인트는 타인에게 기록 및 공개됩니다.
        <br>(연락처, 지원 분야는 매칭을 위한 용도로 저장되지만, 사용자에게 공개되지는 않습니다.)</h5>

        <script>
            const imgInput = document.getElementById("img1");
            const previewImg = document.getElementById("preview-img");
            const previewText = document.getElementById("preview-text");

            imgInput.addEventListener("change", function () {
                const file = imgInput.files[0];

                if (!file) {
                    previewImg.style.display = "none";
                    previewText.style.display = "block";
                    return;
                }

                previewImg.src = URL.createObjectURL(file);
                previewImg.style.display = "block";
                previewText.style.display = "none";
            });
        </script>

    </body>
</html>
